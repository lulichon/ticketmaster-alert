name: Deploy Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create dashboard
        run: |
          mkdir -p public
          echo '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta http-equiv="refresh" content="30"><title>Ticketmaster Alert</title></head><body style="font-family:Arial;background:#111;color:#eee;padding:30px;"><h1>🎟 Ticketmaster Alert</h1><div style="background:#1e1e1e;padding:20px;border-radius:14px;"><h2>Bad Bunny</h2><p>Surveillance active toutes les 5 minutes.</p><p>Dernière mise à jour : '"$(date)"'</p><p><a style="color:#93c5fd;" href="https://www.ticketmaster.fr/fr/manifestation/bad-bunny-billet/idmanif/622222">Ouvrir Ticketmaster</a></p></div></body></html>' > public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
